name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg,updater'
            sig_pattern: 'bundle/macos/*.app.tar.gz.sig'
            artifact_pattern: 'bundle/dmg/*.dmg'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            sig_pattern: 'bundle/nsis/*-setup.exe.sig'
            artifact_pattern: 'bundle/nsis/*-setup.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: '净值雷达 v__VERSION__'
          releaseBody: '自动编译打包发布，包含 macOS (Arm64) 与 Windows (x64) 二进制包。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'

      - name: Upload .sig file to release (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIG_FILE=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz.sig" 2>/dev/null | head -1)
          TAR_FILE=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz" 2>/dev/null | head -1)
          if [ -n "$SIG_FILE" ]; then
            echo "Uploading $SIG_FILE"
            gh release upload v0.1.0 "$SIG_FILE" "$TAR_FILE" --clobber
          fi

      - name: Upload .sig file to release (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIG_FILE=$(find apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*-setup.exe.sig" 2>/dev/null | head -1)
          NSIS_FILE=$(find apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*-setup.nsis.zip" 2>/dev/null | head -1)
          NSIS_SIG_FILE=$(find apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*-setup.nsis.zip.sig" 2>/dev/null | head -1)
          if [ -n "$SIG_FILE" ]; then
            echo "Uploading $SIG_FILE"
            gh release upload v0.1.0 "$SIG_FILE" "$NSIS_FILE" "$NSIS_SIG_FILE" --clobber
          fi
