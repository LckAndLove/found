name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg,updater'
            sig_pattern: 'bundle/macos/*.app.tar.gz.sig'
            artifact_pattern: 'bundle/dmg/*.dmg'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            sig_pattern: 'bundle/nsis/*-setup.exe.sig'
            artifact_pattern: 'bundle/nsis/*-setup.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: '净值雷达 v__VERSION__'
          releaseBody: '自动编译打包发布，包含 macOS (Arm64) 与 Windows (x64) 二进制包。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'

      - name: Upload updater assets and signatures
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const version = require('./apps/desktop/src-tauri/tauri.conf.json').version;
          const tagName = 'v' + version;
          console.log('Target Release:', tagName);

          const searchDirs = [
            path.join('apps', 'desktop', 'src-tauri', 'target', 'aarch64-apple-darwin', 'release', 'bundle', 'macos'),
            path.join('apps', 'desktop', 'src-tauri', 'target', 'x86_64-pc-windows-msvc', 'release', 'bundle', 'nsis')
          ];

          searchDirs.forEach(dir => {
            console.log('Checking directory:', dir);
            if (fs.existsSync(dir)) {
              const files = fs.readdirSync(dir);
              console.log('Directory contents:', files);
              const matched = files.filter(f => f.endsWith('.sig') || f.endsWith('.tar.gz') || f.endsWith('.zip'));
              matched.forEach(file => {
                const fullPath = path.join(dir, file);
                console.log('Uploading file:', fullPath);
                try {
                  execSync('gh release upload \"' + tagName + '\" \"' + fullPath + '\" --clobber', { stdio: 'inherit' });
                } catch (err) {
                  console.error('Failed to upload:', fullPath, err.message);
                }
              });
            } else {
              console.log('Directory does not exist:', dir);
            }
          });
          "




